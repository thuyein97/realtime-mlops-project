name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: testhgpit

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Use built-in token
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Generate dataset
      run: python generate_data.py
    
    - name: Train model
      run: python train.py
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Push model to S3 directly
      run: |
        MODEL_URI="s3://testhgpit/models/${{ github.run_number }}/churn_model.pkl"
        aws s3 cp models/churn_model.pkl "$MODEL_URI"
        echo "MODEL_URI=$MODEL_URI" >> "$GITHUB_ENV"
    
    - name: Commit updated inference.yaml
      run: |
        sed -i "s|storageUri: .*|storageUri: ${MODEL_URI}|g" k8s/inference.yaml
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add k8s/inference.yaml
        if git diff --staged --quiet; then
          echo "No manifest changes to commit"
        else
          git commit -m "Update churn model to run ${{ github.run_number }} [skip ci]"
          git push
        fi
